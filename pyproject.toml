[project]
name = "financial-knowledge-graph"
version = "0.1.0"
description = "AI-powered pipeline for extracting and visualizing financial knowledge graphs"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "docs/readme.md"
requires-python = ">=3.8.1"
dependencies = [
    # Core dependencies
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    
    # PDF Processing
    "PyMuPDF>=1.23.0",
    "pdfplumber>=0.10.0",
    
    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    
    # Graph Database
    "neo4j>=5.0.0",
    
    # Visualization
    "networkx>=3.0",
    "plotly>=5.15.0",
    "pyvis>=0.3.2",
    "matplotlib>=3.7.0",
    
    # Web Interface (Optional)
    "streamlit>=1.25.0",
    "streamlit-agraph>=0.0.45",
    
    # Text Processing
    "nltk>=3.8",
    "spacy>=3.6.0",
    
    # Utilities
    "tqdm>=4.65.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true